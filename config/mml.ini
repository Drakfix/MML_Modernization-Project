; Mega Man Legends Modernization - settings, read by mml.dll when the game starts.
; The start menu and the in-game menu update the keys they manage and leave everything else alone.

[video]
; anim_blend = 1: Mega Man's animation changes cross-fade instead of snapping (0 = as the original)
anim_blend=1
; fill = as wide as your screen, experimental (16:10, ultrawide, a phone; wider than 16:9 draws to the sides now, not
; tested much yet), 16:9 = a 16:9 picture on any screen (bars where it's wider or narrower),
; 4:3 = the original projection
aspect=fill
; (marks the aspect values above as current: an older "16:9" meant fill)
aspect_fill=1
; native = real wide picture (recommended), anamorphic = old 4:3-stretch method
mode=native
; width of the wide picture at 480 lines; 0 = work it out from your monitor
; (with renderer=ddrawcompat it must also be listed in DDrawCompat.ini's SupportedResolutions;
; the start menu does both)
native_width=0
; mml = our own Direct3D 11 renderer (borderless, alt-tab and screenshots work)
; ddrawcompat = the DDrawCompat wrapper the 0.1 releases used
renderer=mml
; the settings below only apply to renderer=mml
; 0 = borderless window over the whole monitor, 1 = normal window
windowed=0
; 1 = exclusive fullscreen: the game takes over the display while it's in front and skips
; the desktop compositor, which lowers GPU use on weaker machines. The trade-offs: switching
; away (Alt+Tab, the Start menu) makes it give the display back, and screen capture and
; overlay tools can't see it. Renders on the GPU the monitor is connected to.
exclusive=0
; 0 = render at your window's resolution, N = N times the game's 480 lines
render_scale=0
; 1 = sharp pixel upscale instead of smooth
nearest_upscale=0
; RetroArch shader preset (.slangp, relative to the game folder or a full path) for the
; final picture, e.g. CRT or scanlines; empty = none. Needs librashader.dll. Presets
; aren't included: get libretro's slang-shaders and put them in Modernization\shaders
shader=
; with a shader and render_scale=0: 1 = render at the game's own resolution (what CRT
; presets expect), 0 = at your window's resolution
shader_scale=1
; antialiasing samples: 1 (off), 2, 4 or 8
msaa=1
; texture filtering: 0 = the game's own, 16 = anisotropic 16x
anisotropy=16
; 1 = nearest neighbor texture filtering (sharp texels like the PlayStation; overrides anisotropy)
nearest_textures=0
; 1 = wait for vsync (the game runs at 30 fps either way)
vsync=0
; distance fog: original, light (pushed fog_distance times farther away) or off
fog=original
fog_distance=2
; how far the level is drawn: full = whole areas to the horizon, fog = only a little past the distance fog
; (faster on slow devices; in some open areas the sky shows where faraway scenery stood in the fog)
draw_distance=full
; models and ground: full = always the full-detail version, original = the game's
; low-detail swaps as things get farther away
lod=full
; 1 = 60 fps: an in-between frame is drawn for every game frame (the game itself runs at 30);
; 2 = 120 fps (experimental, tested on Android): three in-between frames, for 120 Hz screens (back to 60 by
; itself where it can't keep up)
interp=1
; 1 = the sky and other background layers scroll smoothly instead of in whole-pixel steps
smooth_sky=1
; 1 = an FPS counter in the top-right corner: the frames per second that reach the screen
show_fps=0
; performance = render on the fastest GPU, display = on the GPU the monitor is connected to
gpu=performance
; push the life/weapon gauges and the minimap out to the screen corners
hud_edges=1
; size of the corner HUD (gauges, minimap), shrunk toward each corner: 0.6 to 1
hud_scale=1
; where the minimap's panel sits, in the game's 320x240 (the original place is 14, 36)
minimap_x=6
minimap_y=12
; top of the boss gauges and of Roll's on the boat rides, in 320x240, clear of the dialogue boxes
; below it (the game's own: 16 and 24; -1 keeps those)
top_gauge_y=4
; vertical framing for widescreen; leave it unless you know why
closer_factor=0.859375

[controls]
; modern = free camera (F5 or click a stick toggles modern controls), camera-relative movement,
;          LT aim, RT shoot, X dodge roll; vanilla = the original controls
mode=modern
; sdl = read the controller through SDL3.dll (Xbox, PlayStation, Switch and most
;       other gamepads); legacy = the old DirectInput path through Xidi.
;       Falls back to legacy on its own if SDL3.dll is missing.
input=sdl
; Japanese version (Rockman DASH) only: us = buttons as in the US version (Cross confirms,
;       Triangle goes back), japanese = as the Japanese version has them (Circle confirms,
;       Cross goes back)
jp_buttons=us
; orbit_start = modern controls on when the game starts
; camera_speed_x / _y = camera speed in % (100 = default), invert_x / invert_y = 1 to invert
; deadzone = stick deadzone in % of full tilt
orbit_start=0
camera_speed_x=100
camera_speed_y=100
invert_x=0
invert_y=0
deadzone=24
; roll (X): speed (stock 512 = running speed), extra animation speed in %
roll_speed=768
roll_anim=50
; analog movement: tilting the stick less than this % walks instead of running;
; walk_min / run_min = speed (in % of normal) at the low end of the walk and run ranges
walk_tilt=55
walk_min=40
run_min=50
; Jet Skates (hold the skates button, RB): skates_speed = top speed at full tilt and
; skates_min = speed at the lightest tilt, both in % of the original top speed;
; skates_toggle=1 makes a press turn them on and the next press off
skates_speed=130
skates_min=25
skates_toggle=0
; buttons while modern controls are on (menus and classic controls keep the originals):
; jump, shoot, special, talk, roll, aim, orbit (= modern controls on/off), menu, select, skates,
; shoulder (= the over-the-shoulder lock-on camera's side) or none
btn_a=jump
btn_b=special
btn_x=roll
btn_y=talk
btn_lb=aim
btn_rb=skates
btn_lt=aim
btn_rt=shoot
btn_l3=orbit
btn_r3=shoulder
btn_back=select
btn_start=menu
; keyboard + mouse with modern controls: mouse look, wheel = next lock-on target, keys below.
; mouse_speed in %.
mouse_keyboard=1
mouse_speed=100
mouse_invert_y=0
; keys for modern controls, up to two each ("W,UP"): letters, digits, F1-F12, SPACE TAB ENTER
; LSHIFT RSHIFT LCTRL RCTRL LALT RALT UP DOWN LEFT RIGHT CAPSLOCK MOUSE1-MOUSE5 and more.
; While they're in use the game's own keyboard keys rest (menus keep them).
key_up=W,UP
key_down=S,DOWN
key_left=A,LEFT
key_right=D,RIGHT
key_walk=LCTRL
key_jump=SPACE
key_shoot=MOUSE1
key_aim=MOUSE2
key_roll=LSHIFT
key_talk=E
key_special=Q
key_menu=TAB
key_select=M
key_orbit=F5
key_skates=C,MOUSE4
key_shoulder=MOUSE3
; lock-on (hold LT near enemies): reticle colour as RRGGBB
reticle_color=FFD840
; aim = camera: firing turns Mega Man to where the camera looks (he keeps moving freely);
;       character: shots go where he faces. crosshair: where camera-aimed shots go; 1 = while
;       aiming (from the first shot, and while aiming over the shoulder), always, or 0 = off
aim=character
crosshair=1
; aim_button = lockon: holding aim locks on to the nearest enemy (Z-targeting);
;              free: holding aim always aims over the shoulder at the crosshair, no lock-on
aim_button=lockon
; aim_assist = 1: while the crosshair is over an enemy the camera turns slower and the crosshair
; closes in (the Shooter combat style turns it on)
aim_assist=0
; camera_shoulder = 1: the camera stays over Mega Man's shoulder all the time (a shooter's camera);
; holding aim moves it closer and zooms in (the Shooter combat style turns it on)
camera_shoulder=0
; camera_fade = 1: Mega Man turns see-through when the camera comes close to him (a wall at his back)
camera_fade=1
; lockon_camera = classic: while locked on, the camera swings behind Mega Man (aiming with no target
; is the original aim, which roots him); shoulder: aiming moves the camera in beside him, looking
; past his shoulder at the locked enemy or, with no target, the horizon, and he keeps moving.
; shoulder = right or left (the shoulder swap button changes it; the game remembers it here)
lockon_camera=classic
shoulder=right
; camera and mouse speed while aiming over the shoulder with no target, in % of the normal speed
; (lower = finer aim; 10 to 200)
aim_sensitivity=60
; walking (forward, back or sideways) keeps going while you shoot, the shot on his arms;
; 0 = stop for each shot, as in the original
walk_shoot=1
; moving back while shooting past a light tilt: walk (the walk back) or jog (experimental: the run
; animation played backward, faster)
backpedal=walk
; how the menus and the title screen's hints name the controller's buttons: auto (the controller
; connected), xbox, ps4, ps5 or switch
button_prompts=auto
; Android: the on-screen touch controls: auto (shown only while no controller is connected), on or off
touch_controls=auto
; Android: how solid the touch controls are drawn, in percent (20 to 80; a pressed button is drawn stronger)
touch_opacity=40

[textures]
; 1 = use HD texture packs: PNGs under Modernization\textures named after the texture they
; replace, any size (see docs/TEXTURE-PACKS.md)
replace=1
; 1 = write every texture the game uses to Modernization\textures\dump (for pack makers)
dump=0

[general]
; 1 = the start menu opens when the app starts (Windows: the desktop shortcut, mml_run64.exe --menu);
; 0 = straight into the game with these settings (hold Back or F2 on the title screen for the menu)
start_menu=1
; play = intro video plays (any button skips it), skip = straight to the title
intro=play
; Android (the start menu's Files page): the version to play when both are imported,
; us = Mega Man Legends, japanese = Rockman DASH (in the Japanese folder, with its own saves).
; Not set: the one that is there.
;edition=us
; 1 = the forest's wind and bird ambience loops while you stay in the area (the original
; PC version plays it once, then the area goes silent); 0 = as the original
ambience_loop=1
; Volumes in percent. Music 0-400: above 100 it plays louder, each track only as far as it goes
; without distorting (the quieter tracks of some audio mods gain the most, the original ones
; little or nothing). Effects (sound_volume) and voices 0-100.
music_volume=100
sound_volume=100
voice_volume=100
; US version: us = the US localization's names, japanese = the original Japanese release's names
; in the text and subtitles (Rock, the Kobun, Digouters, Reaverbirds...; experimental)
names=us
; 1 = the title menu offers Easy, Normal and Hard from the start (the original unlocks Hard by
; clearing the game, and Easy by clearing it on Hard or in under three hours); 0 = as the original.
; Saves are not changed.
all_difficulties=0
